services:
  - type: web
    name: luffaguard
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CNN_DRIVE_ID
        sync: false       # paste your Google Drive file ID in Render dashboard
      - key: HYBRID_DRIVE_ID
        sync: false
